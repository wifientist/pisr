# Development: hot reload on both sides.
#
#   docker compose -f docker-compose.dev.yml up
#
# Open http://localhost:4173 — vite serves the SPA and proxies /api to the
# backend container. The backend runs API-only here (PISR_STATIC_DIR points at
# nothing, so main.py skips its StaticFiles mount) and reloads on edits to api/.
#
# Production is a different shape entirely: one container on :8080 serving both.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pisr-backend-dev
    env_file: .env
    environment:
      # Deliberately nonexistent: vite owns the SPA in dev.
      PISR_STATIC_DIR: /nonexistent
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    volumes:
      - ./api:/app
    ports:
      - "127.0.0.1:${API_DEV_PORT:-4174}:8080"
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

  frontend:
    image: node:20-alpine
    container_name: pisr-frontend-dev
    working_dir: /app
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${VITE_DEV_PORT:-4173}:4173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
