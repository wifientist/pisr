# Production: one container, one port, one process.
#
# FastAPI serves both the API and the built SPA, so there is no nginx, no node
# at runtime, no CORS (same origin) and no proxy read-timeout to tune — which
# matters, because a switch-port crawl on a large venue is exactly the kind of
# request that brushes up against a default 90s proxy timeout.
#
# One volume, and it holds one small JSON file. PRISM still stores no TENANT
# data — no database, no cache, no snapshot directory, no report that outlives
# the response that carried it. What `prism-config` holds is the section
# visibility policy: which report cards an ordinary user is shown, written by
# an admin through the portal. See api/visibility.py for why that is an
# exception to the rule rather than a hole in it, and guard the distinction —
# if something later wants to keep a *report* here, that is a different feature
# with its own argument to make.
#
# Without the volume PRISM still runs: the policy file lives inside the
# container, the portal reports itself read-only, and nothing is hidden from
# anyone. That is the harmless direction, and it is what a hand-run
# `docker run` gets.
#
# ── Where the secrets live ───────────────────────────────────────────
#
# Simplest, and the default: a 0600 .env next to this file.
#
# Better on a shared host: keep the file out of the working tree entirely, so a
# stray `chmod -R`, a backup job or an editor swapfile cannot reach it.
#
#   sudo install -d -m 0750 /etc/prism
#   sudo install -m 0600 .env /etc/prism/prism.env
#   PRISM_ENV_FILE=/etc/prism/prism.env docker compose up -d
#
# Best, if you want the shared secret out of the container environment
# altogether: leave the non-secret settings in the env file and hand the two
# real credentials over as mounted files. `docker inspect` and /proc/1/environ
# print environment variables; they do not print /run/secrets. config.py reads
# <NAME>_FILE in preference to <NAME> for every setting, so this needs no code
# change — uncomment the two blocks below and set, in the env file:
#
#   R1_SHARED_SECRET_FILE=/run/secrets/r1_shared_secret
#   PRISM_AUTH_PASSPHRASE_FILE=/run/secrets/prism_passphrase
#
# (and drop the plain R1_SHARED_SECRET / PRISM_AUTH_PASSPHRASE lines).

services:
  prism:
    build:
      context: .
      args:
        # deploy/prism-update.sh exports these. Empty on a hand-run build, which
        # surfaces as "unknown" on /api/status rather than as a wrong answer.
        PRISM_BUILD_SHA: ${PRISM_BUILD_SHA:-unknown}
        PRISM_BUILD_TIME: ${PRISM_BUILD_TIME:-}
    container_name: prism
    # `always`, not `unless-stopped`: rootless podman has no daemon, so the
    # policy only matters at boot, where podman-restart.service starts
    # `--filter restart-policy=always` and nothing else. `unless-stopped` left
    # PRISM down after an LXC reboot (2026-10-15). Needs, once per box:
    #   systemctl --user enable podman-restart.service
    restart: always
    env_file: ${PRISM_ENV_FILE:-.env}
    ports:
      # Defaults to every interface, which is what makes PRISM reachable from
      # the rest of the LAN — the intent, and also why the gate in
      # api/auth.py is not optional. Set PRISM_BIND in .env to narrow it:
      #   PRISM_BIND=127.0.0.1     this host only
      #   PRISM_BIND=10.0.25.25    one interface, e.g. the VPN side
      #
      # In PRISM_AUTH_MODE=proxy, delete this block entirely and use
      # `expose: ["8080"]` instead — a published port there is an
      # authentication bypass, not a convenience. See README, "SSO".
      - "${PRISM_BIND:-0.0.0.0}:${PRISM_PORT:-8080}:8080"
    volumes:
      # The visibility policy, accounts, org baseline and batch record. Named rather than a bind mount
      # so it survives `docker compose down` and the image rebuild that every
      # deploy performs — a policy written into the image's own filesystem
      # would silently revert at the next deploy, which reads as the save
      # having quietly undone itself hours later.
      - prism-config:/data
    # secrets:
    #   - r1_shared_secret
    #   - prism_passphrase
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  # EXTERNAL, and named exactly, so compose never makes it. Create it once per
  # host before the first `up`:
  #
  #   podman volume create prism-config      (or: docker volume create …)
  #
  # The alternative — compose creating `<project>_<key>` on demand — means that
  # anything which changes the project name or the key (renaming the checkout
  # directory, renaming this entry) mounts a NEW EMPTY volume and starts
  # happily on it. Every account, role, baseline and batch record appears to
  # vanish while the real volume sits intact and unmounted. A missing external
  # volume is a refusal to start instead, which the deploy script's health
  # check turns into a rollback rather than an outage.
  prism-config:
    external: true
    name: prism-config

# secrets:
#   r1_shared_secret:
#     file: /etc/prism/r1_shared_secret
#   prism_passphrase:
#     file: /etc/prism/prism_passphrase
